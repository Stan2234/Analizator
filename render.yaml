services:
  - type: web
    name: analizator
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python write_secrets.py && streamlit run macro_agent_app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    autoDeploy: true
    healthCheckPath: /
    disk:
      name: analizator-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANALIZATOR_DB_PATH
        value: /data/analizator.db
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: STRIPE_PRICE_MONTH
        value: price_1UPn4fFvzDXAEXwv6G4iPrE0
      - key: STRIPE_PRICE_YEAR
        value: price_1UPn4dFvzDXAEXwv7ltRExsE
      - key: STRIPE_PRICE_PLUS_MONTH
        value: price_1UQMn1FvzDXAEXwv8O30RCW0
      - key: STRIPE_PRICE_PLUS_YEAR
        value: price_1UQMn1FvzDXAEXwvaVxJRx5j
      - key: STRIPE_PRICE_PRO_MONTH
        value: price_1UQMn2FvzDXAEXwva0gtwbzX
      - key: STRIPE_PRICE_PRO_YEAR
        value: price_1UQMn3FvzDXAEXwvUcoLj1vm
      - key: PUBLIC_URL
        value: https://analizator-vigr.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
